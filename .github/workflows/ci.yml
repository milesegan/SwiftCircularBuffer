name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test and Format
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Verify formatting
        run: |
          swift format format --in-place --recursive --parallel --configuration .swift-format Package.swift Sources Tests
          git diff --exit-code -- Package.swift Sources Tests

      - name: Run tests
        run: swift test
